apis:
- name: Payem AI Discovery API
  description: >-
    A read-only, unauthenticated AI-discovery content API published for Payem by
    LightSite.ai. It exposes Payem's own marketing and knowledge content - business
    profile, product catalog, categories, testimonials, FAQ, curated Q&A pages and a
    semantic search endpoint - as OpenAPI 3.1 operations returning schema.org JSON-LD.
    This is NOT the PayEm product API: it cannot issue a card, create a request, post an
    invoice or read a ledger. PayEm ships no public product API.
  humanURL: https://www.payem.co/
  baseURL: https://api.llm-discovery-api.com/functions/v1/llm-discovery/public
