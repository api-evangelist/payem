actions:
- target: $.info
  description: Record the operator, the tenancy model and what this API is not.
  update:
    x-operator:
      name: LightSite.ai
      host: api.llm-discovery-api.com
      relationship: >-
        Third-party AI-discovery service operating this contract on PayEm's behalf. PayEm
        opted in from its own edge - www.payem.co/robots.txt names /.well-known/openapi.json
        and /.well-known/ai-plugin.json, and both 308-redirect to this host. The skills
        manifest records confidence_source "owner_provided".
      origin_verified_header: 'x-lightsite-origin-verified: false'
    x-not-the-product-api: >-
      This contract exposes PayEm marketing and knowledge content only. It cannot issue a
      card, create a request, post an invoice, pay a vendor or read a ledger. PayEm
      publishes no public product API.
- target: $.servers[0]
  description: Note that the server is a shared multi-tenant host keyed on a required domain parameter.
  update:
    x-multi-tenant: true
    x-tenant-parameter: domain
    x-tenant-value: payem.co
- target: $.paths
  description: Record the public endpoints the contract omits but the service advertises.
  update:
