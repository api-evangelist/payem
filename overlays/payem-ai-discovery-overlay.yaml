    - path: /.well-known/skills.json
    - path: /.well-known/ai-catalog.json
    - path: /.well-known/ai-manifest.json
    - path: /ai/v1/company.json
    - path: /ai/v1/status.json
    - path: /knowledge.json
    - path: /pages/{page_id}
    - path: /ai-manifest
    x-deprecated-endpoints:
